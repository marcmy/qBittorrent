version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "GHA CI"
    groups:
      GHA_CI-dependency-update:
        patterns:
          - "*"
    labels:
      - "CI"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100

  - package-ecosystem: "pre-commit"
    directory: "/"
    commit-message:
      prefix: "GHA CI"
    groups:
      GHA_CI-dependency-update:
        patterns:
          - "*"
    labels:
      - "CI"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
