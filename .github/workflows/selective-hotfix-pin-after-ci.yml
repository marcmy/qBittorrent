name: Pin selective hotfix after source validation

on:
  workflow_run:
    workflows: ["CI - Python"]
    types: [completed]

permissions:
  contents: write

jobs:
  pin:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'feature/selective-file-recheck' &&
      github.event.workflow_run.head_sha == 'dd06869301e65a7a7d42436fb1f75e984141629c'
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper from default branch
        uses: actions/checkout@v4
        with:
          ref: custom/master
          path: helper

      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/selective-file-recheck
          fetch-depth: 0
          path: work

      - name: Pin Windows CI to libtorrent hotfix
        working-directory: work
        run: python ../helper/.github/selective_hotfix_pin.py

      - name: Commit temporary integration pin
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci_windows.yaml
          git diff --cached --check
          git commit -m "ci: pin selective recheck hotfix build"
          git push origin HEAD:feature/selective-file-recheck
