name: CI - Windows

on:
  push:
    branches:
      - feature/selective-file-recheck

permissions:
  contents: write

jobs:
  apply-progress-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qBittorrent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Apply patch and restore workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/base/bittorrent/torrent.h",
              '#pragma once\n\n#include <QtContainerFwd>\n',
              '#pragma once\n\n#include <functional>\n\n#include <QtContainerFwd>\n')

          replace_once(
              "src/base/bittorrent/torrent.h",
              '        virtual void recheckFiles(const QList<int> &indexes) = 0;\n',
              '        virtual void recheckFiles(const QList<int> &indexes\n'
              '                , std::function<void(int, int)> progress = {}) = 0;\n')

          replace_once(
              "src/base/bittorrent/torrentimpl.h",
              '        void recheckFiles(const QList<int> &indexes) override;\n',
              '        void recheckFiles(const QList<int> &indexes\n'
              '                , std::function<void(int, int)> progress = {}) override;\n')

          impl = Path("src/base/bittorrent/torrentimpl.cpp")
          text = impl.read_text(encoding="utf-8")
          start = text.index("void TorrentImpl::recheckFiles(const QList<int> &indexes)")
          end = text.index("\nvoid TorrentImpl::setSequentialDownload", start)
          block = """void TorrentImpl::recheckFiles(const QList<int> &indexes
                  , std::function<void(int, int)> progress)
          {
              if (!hasMetadata() || indexes.isEmpty())
              {
                  if (progress)
                      progress(0, 0);
                  return;
              }

              std::vector<lt::file_index_t> nativeIndexes;
              nativeIndexes.reserve(static_cast<std::size_t>(indexes.size()));

              for (const int index : indexes)
              {
                  if ((index < 0) || (index >= filesCount()))
                      continue;

                  nativeIndexes.push_back(m_torrentInfo.nativeIndexes().at(index));
              }

              if (nativeIndexes.empty())
              {
                  if (progress)
                      progress(0, 0);
                  return;
              }

          #ifdef TORRENT_HAS_RECHECK_FILES_PROGRESS_CALLBACK
              m_nativeHandle.recheck_files(std::move(nativeIndexes), std::move(progress));
          #else
              m_nativeHandle.recheck_files(std::move(nativeIndexes));
              if (progress)
                  progress(0, 0);
          #endif
          }
          """
          impl.write_text(text[:start] + block + text[end:], encoding="utf-8")

          replace_once(
              "src/gui/torrentcontentwidget.cpp",
              '#include "torrentcontentwidget.h"\n\n#include <QApplication>\n',
              '#include "torrentcontentwidget.h"\n\n#include <memory>\n\n#include <QApplication>\n')

          replace_once(
              "src/gui/torrentcontentwidget.cpp",
              '#include <QMessageBox>\n#include <QModelIndexList>\n#include <QSet>\n',
              '#include <QMessageBox>\n#include <QMetaObject>\n#include <QModelIndexList>\n#include <QPointer>\n#include <QProgressDialog>\n#include <QSet>\n')

          replace_once(
              "src/gui/torrentcontentwidget.cpp",
              '            if (!fileIndexes.isEmpty())\n'
              '                torrent->recheckFiles(fileIndexes.values());\n',
              '            if (fileIndexes.isEmpty())\n'
              '                return;\n\n'
              '            auto *dialog = new QProgressDialog(tr("Rechecking selected files..."), QString(), 0, 0, this);\n'
              '            dialog->setWindowTitle(tr("Selective recheck"));\n'
              '            dialog->setWindowModality(Qt::NonModal);\n'
              '            dialog->setCancelButton(nullptr);\n'
              '            dialog->setMinimumDuration(0);\n'
              '            dialog->setAutoClose(false);\n'
              '            dialog->setAutoReset(false);\n'
              '            dialog->setAttribute(Qt::WA_DeleteOnClose);\n'
              '            dialog->show();\n\n'
              '            const auto progressDialog = std::make_shared<QPointer<QProgressDialog>>(dialog);\n'
              '            torrent->recheckFiles(fileIndexes.values(), [progressDialog](const int completed, const int total)\n'
              '            {\n'
              '                QMetaObject::invokeMethod(qApp, [progressDialog, completed, total]\n'
              '                {\n'
              '                    if (progressDialog->isNull())\n'
              '                        return;\n\n'
              '                    QProgressDialog *dialog = progressDialog->data();\n'
              '                    if ((completed < 0) || (total <= 0))\n'
              '                    {\n'
              '                        dialog->close();\n'
              '                        return;\n'
              '                    }\n\n'
              '                    if ((dialog->minimum() != 0) || (dialog->maximum() != total))\n'
              '                        dialog->setRange(0, total);\n\n'
              '                    dialog->setValue((completed > total) ? total : completed);\n'
              '                    if (completed >= total)\n'
              '                        dialog->close();\n'
              '                }, Qt::QueuedConnection);\n'
              '            });\n')

          subprocess.run(["git", "fetch", "origin", "custom/master", "--depth=1"], check=True)
          subprocess.run(["git", "checkout", "FETCH_HEAD", "--", ".github/workflows/ci_windows.yaml"], check=True)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "-A"], check=True)
          subprocess.run(["git", "commit", "-m", "feat: show selective recheck progress"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:feature/selective-file-recheck"], check=True)
