name: Pin selective recheck hotfix build

on:
  push:
    branches:
      - feature/selective-file-recheck

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/selective-file-recheck
          fetch-depth: 0

      - name: Pin Windows CI to libtorrent hotfix
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/ci_windows.yaml')
          text = path.read_text(encoding='utf-8')
          old = 'custom/qbittorrent-2.1'
          new = 'fix/selective-recheck-crash'
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Commit pin
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci_windows.yaml
          git commit -m "ci: build selective recheck against libtorrent hotfix"
          git push origin HEAD:feature/selective-file-recheck
