name: Sync upstream after libtorrent

on:
  push:
    branches:
      - custom/master
    paths:
      - .github/workflows/sync_upstream.yaml
  repository_dispatch:
    types:
      - libtorrent-upstream-synced
      - libtorrent-pr-build
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge qBittorrent master
    if: github.event_name != 'repository_dispatch' || github.event.action == 'libtorrent-upstream-synced'
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Check out custom qBittorrent branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: custom/master
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Fetch upstream qBittorrent master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add source https://github.com/qbittorrent/qBittorrent.git
          git fetch --prune --no-tags source master

      - name: Merge upstream while preserving fork workflows
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse source/master)"
          original_head="$(git rev-parse HEAD)"

          if git merge-base --is-ancestor source/master HEAD; then
            echo "custom/master already contains current upstream master."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            merge_status=0
            git merge --no-commit --no-ff source/master || merge_status=$?

            # Replace the entire workflow directory with the exact tree from
            # the fork before the merge. Removing it first also discards any
            # new workflow files introduced by upstream.
            git rm -r -f --ignore-unmatch .github/workflows
            if git cat-file -e "$original_head:.github/workflows" 2>/dev/null; then
              git checkout "$original_head" -- .github/workflows
            fi

            # Keep the fork's pre-commit config coupled to the preserved
            # workflow helper files instead of accepting upstream-only hooks.
            if git cat-file -e "$original_head:.pre-commit-config.yaml" 2>/dev/null; then
              git checkout "$original_head" -- .pre-commit-config.yaml
            fi

            # Preserve the fork's finishedStorage resume-data metadata while
            # incorporating upstream's asynchronous storage-worker refactor.
            if git diff --name-only --diff-filter=U | grep -Fxq "src/base/bittorrent/bencoderesumedatastorage.cpp"; then
              git checkout --theirs -- src/base/bittorrent/bencoderesumedatastorage.cpp
              python3 - <<'PY'
          from pathlib import Path
          path = Path("src/base/bittorrent/bencoderesumedatastorage.cpp")
          content = path.read_text()
          if "qBt-finishedStorage" in content:
              raise SystemExit("Upstream already defines finishedStorage; review merge manually")
          edits = [
              ('    torrentParams.hasFinishedStatus = resumeDataRoot.dict_find_int_value("qBt-seedStatus");',
                '    torrentParams.hasFinishedStatus = resumeDataRoot.dict_find_int_value("qBt-seedStatus");\n    torrentParams.hasFinishedStorage = resumeDataRoot.dict_find_int_value("qBt-finishedStorage");'),
              ('        data["qBt-seedStatus"] = m_resumeData.hasFinishedStatus;',
                '        data["qBt-seedStatus"] = m_resumeData.hasFinishedStatus;\n        data["qBt-finishedStorage"] = m_resumeData.hasFinishedStorage;'),
          ]
          for before, after in edits:
              if content.count(before) != 1:
                  raise SystemExit(f"Upstream resume-data layout changed; review required: {before}")
              content = content.replace(before, after, 1)
          path.write_text(content)
          PY
              git add src/base/bittorrent/bencoderesumedatastorage.cpp
            fi
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [[ -n "$unresolved" ]]; then
              echo "::warning::Unresolved upstream merge conflicts remain; opening a pull request to resolve them:"
              printf '%s\n' "$unresolved"
              git merge --abort || git reset -q --hard "$original_head"
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              echo "base_sha=$original_head" >> "$GITHUB_OUTPUT"
              echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$merge_status" -ne 0 ]] && ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "::error::git merge failed without creating a resolvable merge state."
              exit "$merge_status"
            fi

            if ! git diff --quiet "$original_head" -- .github/workflows .pre-commit-config.yaml; then
              echo "::error::Preserved fork CI files changed during the upstream merge."
              git diff "$original_head" -- .github/workflows .pre-commit-config.yaml
              exit 1
            fi

            git commit --no-edit
            git push origin HEAD:refs/heads/custom/master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open conflict pull request
        if: steps.sync.outputs.conflict == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          FORK_BRANCH: custom/master
          BASE_SHA: ${{ steps.sync.outputs.base_sha }}
          UPSTREAM_REF: source/master
          UPSTREAM_NAME: qbittorrent/qBittorrent@master
          KEEP_FORK_PATHS: .github/workflows .pre-commit-config.yaml
          PR_NOTE: >-
            The sync normally fixes `src/base/bittorrent/bencoderesumedatastorage.cpp` by itself.
            If it is listed, keep both upstream's changes and the fork's `qBt-finishedStorage` lines.
        run: bash .github/scripts/sync-conflict-pr.sh

      - name: Start Windows build against synced libtorrent
        if: >-
          steps.sync.outputs.conflict != 'true' && (
          github.event_name == 'workflow_dispatch' ||
          steps.sync.outputs.changed == 'true' ||
          github.event.client_payload.libtorrent_changed == 'true')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          LIBTORRENT_REF: ${{ github.event.client_payload.libtorrent_sha || 'custom/qbittorrent-2.1' }}
          QBITTORRENT_REF: ${{ steps.sync.outputs.head_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci_windows.yaml',
              ref: 'custom/master',
              inputs: {
                libtorrent_ref: process.env.LIBTORRENT_REF,
                qbittorrent_ref: process.env.QBITTORRENT_REF
              }
            });

      - name: Summarize sync chain
        if: always()
        env:
          SOURCE_HEAD: ${{ steps.sync.outputs.source_sha }}
          QBITTORRENT_CHANGED: ${{ steps.sync.outputs.changed }}
          QBITTORRENT_HEAD: ${{ steps.sync.outputs.head_sha }}
          LIBTORRENT_CHANGED: ${{ github.event.client_payload.libtorrent_changed || 'manual-or-scheduled' }}
          LIBTORRENT_HEAD: ${{ github.event.client_payload.libtorrent_sha || 'custom/qbittorrent-2.1' }}
        run: |
          {
            echo "## Upstream sync chain"
            echo "- qBittorrent upstream head: $SOURCE_HEAD"
            echo "- qBittorrent custom changed: $QBITTORRENT_CHANGED"
            echo "- qBittorrent custom head: $QBITTORRENT_HEAD"
            echo "- libtorrent changed: $LIBTORRENT_CHANGED"
            echo "- libtorrent ref: $LIBTORRENT_HEAD"
          } >> "$GITHUB_STEP_SUMMARY"

  build-libtorrent-pr:
    name: Build qBittorrent against libtorrent PR
    if: github.event_name == 'repository_dispatch' && github.event.action == 'libtorrent-pr-build'
    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - name: Validate libtorrent PR revision
        shell: bash
        env:
          LIBTORRENT_REF: ${{ github.event.client_payload.libtorrent_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$LIBTORRENT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected a 40-character libtorrent commit SHA, got: $LIBTORRENT_REF"
            exit 1
          fi

      - name: Start Windows build against libtorrent PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          LIBTORRENT_REF: ${{ github.event.client_payload.libtorrent_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci_windows.yaml',
              ref: 'custom/master',
              inputs: {
                libtorrent_ref: process.env.LIBTORRENT_REF,
                qbittorrent_ref: 'custom/master'
              }
            });

      - name: Summarize PR build chain
        env:
          LIBTORRENT_HEAD: ${{ github.event.client_payload.libtorrent_sha }}
        run: |
          {
            echo "## libtorrent PR validation"
            echo "- qBittorrent ref: custom/master"
            echo "- libtorrent ref: $LIBTORRENT_HEAD"
            echo "- upstream sync: skipped"
          } >> "$GITHUB_STEP_SUMMARY"
