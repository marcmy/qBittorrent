name: Apply selective file recheck patch

on:
  push:
    branches:
      - feature/selective-file-recheck
    paths:
      - .github/selective-file-recheck.patch
      - .github/workflows/apply-selective-file-recheck.yml
  pull_request:
    branches:
      - custom/master

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/selective-file-recheck
          fetch-depth: 0
      - name: Apply patch
        run: |
          git apply --check .github/selective-file-recheck.patch
          git apply .github/selective-file-recheck.patch
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/base/bittorrent/torrent.h src/base/bittorrent/torrentimpl.h src/base/bittorrent/torrentimpl.cpp src/gui/torrentcontentwidget.cpp
          git commit -m "feat: recheck selected torrent files [skip ci]"
          git push origin HEAD:feature/selective-file-recheck
