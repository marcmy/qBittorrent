name: Selective recheck direct staging

on:
  pull_request_target:
    branches:
      - custom/master
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 24 && github.event.pull_request.head.ref == 'feature/selective-file-recheck' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper from base branch
        uses: actions/checkout@v4
        with:
          ref: custom/master
          path: helper

      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/selective-file-recheck
          fetch-depth: 0
          path: work

      - name: Apply selective recheck source edits
        working-directory: work
        run: python ../helper/.github/selective_recheck_apply.py

      - name: Commit source changes
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/base/bittorrent/torrent.h src/base/bittorrent/torrentimpl.h src/base/bittorrent/torrentimpl.cpp src/gui/torrentcontentwidget.cpp
          git diff --cached --check
          git commit -m "feat: recheck selected torrent files"
          git push origin HEAD:feature/selective-file-recheck
