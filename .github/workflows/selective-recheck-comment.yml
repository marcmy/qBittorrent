name: Selective recheck comment staging

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.issue.pull_request && github.event.issue.number == 24 && github.event.comment.body == '/apply-selective-recheck'
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper from default branch
        uses: actions/checkout@v4
        with:
          ref: custom/master
          path: helper

      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/selective-file-recheck
          fetch-depth: 0
          path: work

      - name: Apply selective recheck source edits
        working-directory: work
        run: python ../helper/.github/selective_recheck_apply.py

      - name: Commit source changes
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/base/bittorrent/torrent.h src/base/bittorrent/torrentimpl.h src/base/bittorrent/torrentimpl.cpp src/gui/torrentcontentwidget.cpp
          git diff --cached --check
          git commit -m "feat: recheck selected torrent files"
          git push origin HEAD:feature/selective-file-recheck
