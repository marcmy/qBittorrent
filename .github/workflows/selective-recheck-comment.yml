name: Selective recheck comment staging

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  pin:
    if: github.event.issue.pull_request && github.event.issue.number == 24 && github.event.comment.body == '/pin-selective-hotfix-build'
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper from default branch
        uses: actions/checkout@v4
        with:
          ref: custom/master
          path: helper

      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/selective-file-recheck
          fetch-depth: 0
          path: work

      - name: Pin Windows CI to libtorrent hotfix
        working-directory: work
        run: python ../helper/.github/selective_hotfix_pin.py

      - name: Commit temporary integration pin
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci_windows.yaml
          git diff --cached --check
          git commit -m "ci: pin selective recheck hotfix build"
          git push origin HEAD:feature/selective-file-recheck
