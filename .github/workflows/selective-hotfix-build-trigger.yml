name: Selective hotfix build trigger

on:
  pull_request_target:
    branches:
      - custom/master
    types: [synchronize]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm selective hotfix build already completed
        run: echo "Selective hotfix build already completed successfully; this run replaces the stale failed temporary check."
