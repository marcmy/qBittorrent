name: Selective hotfix build comment

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/build-selective-hotfix'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact Windows hotfix build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          gh workflow run ci_windows.yaml \
            --repo "$REPO" \
            --ref feature/selective-file-recheck \
            -f libtorrent_ref=e492564d3a044c60688dd034fd8bf4eca2cad520 \
            -f qbittorrent_ref=feature/selective-file-recheck

          run_id=""
          for i in {1..30}; do
            run_id="$(gh run list \
              --repo "$REPO" \
              --workflow ci_windows.yaml \
              --branch feature/selective-file-recheck \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$run_id" ]]; then
            echo 'Could not resolve dispatched run ID' >&2
            exit 1
          fi

          gh issue comment "$ISSUE" \
            --repo "$REPO" \
            --body "hotfix-build-run: $run_id"
